<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperRätsel</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1e2126;
      --text: #f1f2f4;
      --muted: #9aa0aa;
      --accent: #818cf8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 1.8rem;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 24px;
  }
  .status {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--accent);
    color: white;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>SuperRätsel</h1>
    <p class="subtitle">Eigenständiges Projekt, unabhängig von der Haupt-Website.</p>
    <span class="status">Grundgerüst bereit</span>
  </div>
</body>
</html>
