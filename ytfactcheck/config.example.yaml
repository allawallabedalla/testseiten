# ---------------------------------------------------------------------------
# ytfactcheck — Konfiguration
# Kopieren nach config.yaml und anpassen. config.yaml ist gitignored.
# ---------------------------------------------------------------------------

model: claude-opus-5

poll:
  # Videos die aelter sind werden beim ersten Lauf ignoriert (kein Nachholen
  # des kompletten Archivs).
  lookback_hours: 48

channels:
  # "handle" ODER "channel_id" angeben. Das Handle wird einmal aufgeloest und
  # in den State geschrieben, danach laeuft alles ueber die Channel-ID.
  - handle: "@ZDFheute"
    name: "ZDFheute"
    risk: normal
    languages: [de, en]

  - handle: "@beispiel-meinungskanal"
    name: "Beispiel Meinungskanal"
    risk: erhoeht
    languages: [de]

  - handle: "@beispiel-problemkanal"
    name: "Beispiel Problemkanal"
    risk: problematisch
    languages: [de]

transcript:
  # Reihenfolge der Versuche: offizielle Untertitel -> Auto-Untertitel (yt-dlp)
  # -> Whisper auf der Tonspur. Whisper braucht faster-whisper + ffmpeg.
  allow_whisper_fallback: false
  whisper_model: small

factcheck:
  # Pro Risikostufe: wie viele Behauptungen maximal geprueft werden, mit
  # welchem Denk-Aufwand, und wie viele unabhaengige Quellen ein Urteil braucht.
  max_claims:
    normal: 5
    erhoeht: 8
    problematisch: 12
  effort:
    normal: medium
    erhoeht: high
    problematisch: xhigh
  min_sources:
    normal: 2
    erhoeht: 3
    problematisch: 3
  # Nur bei "problematisch": zusaetzliche Analyse von Framing, Auslassungen
  # und rhetorischen Mustern (kein Faktencheck, sondern Einordnung).
  rhetoric_analysis_for: [problematisch]

publish:
  youtube_comment:
    enabled: false          # siehe README, Abschnitt "Risiko"
    require_approval: true  # NIEMALS ohne menschliche Freigabe posten
    max_per_day: 3
    # Nur kommentieren wenn mindestens eine Behauptung so bewertet wurde:
    only_post_if: [falsch, irrefuehrend]
    max_chars: 9000         # YouTube-Limit liegt bei ~10.000 Zeichen
